<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3차 연구진 대시보드 · AI 기반 초연결 지능도시</title>
<script src="https://aicity3rd.github.io/config.js?v=1795430457650"></script>
<style>
:root{--ink:#172033;--muted:#697386;--line:#e5e9f0;--blue:#2457a6;--soft:#f5f7fb;--green:#237a52}*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:var(--ink);font-family:Arial,'Noto Sans KR',sans-serif}button,input{font:inherit}.wrap{max-width:1440px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}.eyebrow{color:var(--blue);font-weight:700;font-size:13px}.top h1{margin:5px 0;font-size:26px}.sub{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid #cbd3df;background:#fff;border-radius:8px;padding:9px 13px;cursor:pointer}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 2px 8px #2033540a;margin-bottom:16px}.gate{max-width:520px;margin:80px auto}.gate h2{margin-top:0}.gate form{display:flex;gap:8px}.gate input{flex:1;border:1px solid #cbd3df;border-radius:8px;padding:10px}.err{color:#b42318;font-size:13px;margin-top:10px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.nav button{border:1px solid #d6dce6;background:#fff;border-radius:999px;padding:8px 13px;cursor:pointer}.nav button.on{background:#e6efff;border-color:#9db9ea;color:#1e4e9a;font-weight:700}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.metric{background:var(--soft);border-radius:10px;padding:14px}.metric b{display:block;font-size:24px;margin-top:7px}.metric span{font-size:12px;color:var(--muted)}.scroll{overflow:auto;max-height:620px;border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}th{position:sticky;top:0;background:#f8faff;color:#48556a;z-index:1}td.num,th.num{text-align:center}.good{color:var(--green);font-weight:700}.muted{color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.bar{height:8px;background:#e9edf4;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#5b8dde}.note{font-size:12px;color:var(--muted);line-height:1.6}.empty{padding:36px;text-align:center;color:var(--muted)}@media(max-width:800px){.wrap{padding:14px}.top{display:block}.actions{margin-top:12px}.metrics{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.top h1{font-size:21px}.gate{margin:40px auto}.gate form{display:block}.gate input,.gate button{width:100%;margin-bottom:8px}}
</style></head>
<body><div id="app"></div>
<script>
(()=>{'use strict';
const API='https://script.google.com/macros/s/AKfycbz6ef78GKaGC2wACUuyj-QV1VDDKKMCXDoWSyV4A9BnDmQpVkKILtK8R4nvSQYig3B2PQ/exec';
const PAIRS=[['R3A','R3B'],['R3A','R3C'],['R3A','R3D'],['R3B','R3C'],['R3B','R3D'],['R3C','R3D']];
const CRIT=[['R3A','데이터 연계·표준화 가능성'],['R3B','도시·시민 서비스 효과성'],['R3C','AI 적용 실효성·고도화 가능성'],['R3D','서비스 확산·운영 지속가능성']];
const app=document.getElementById('app'); let raw=null,tab='overview',hideNames=false,err='';
const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtPct=x=>(Number(x||0)*100).toFixed(1)+'%';
function pv(x){if(x==null||x==='')return null;if(typeof x==='number')return x; if(typeof x==='object'){const v=Number(x.v)||1;return x.side==='R'?1/v:v}return Number(x)||null}
function ahp(p2){if(!p2)return null;const n=4,m=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?1:0));for(const [a,b] of PAIRS){const v=pv(p2[a+':'+b]);if(!v)return null;const i=CRIT.findIndex(x=>x[0]===a),j=CRIT.findIndex(x=>x[0]===b);m[i][j]=v;m[j][i]=1/v}const g=m.map(r=>Math.pow(r.reduce((a,b)=>a*b,1),1/n));const sum=g.reduce((a,b)=>a+b,0),w=g.map(x=>x/sum);let lm=0;for(let i=0;i<n;i++)lm+=(m[i].reduce((a,b,j)=>a+b*w[j],0)/w[i]);const ci=(lm-n)/(n-1),cr=ci/0.9;return {w,cr}}
function serviceRows(){const sv=(window.SURVEY_CONFIG&&window.SURVEY_CONFIG.services)||[];const rs=(raw&&raw.responses)||[];const out=[];const sums={};for(const s of sv){sums[s.id]={n:0,a:0,b:0,c:0,d:0}}for(const r of rs){const p=r.responses&&r.responses.p3||{};for(const s of sv){const q=p[s.id]||{};const vals=[q.R3A,q.R3B,q.R3C,q.R3D].map(Number);if(vals.some(v=>v>=1&&v<=5)){sums[s.id].n++;sums[s.id].a+=vals[0]||0;sums[s.id].b+=vals[1]||0;sums[s.id].c+=vals[2]||0;sums[s.id].d+=vals[3]||0}}}const aw=avgWeights();return sv.map(s=>{const z=sums[s.id],v=z.n?[z.a/z.n,z.b/z.n,z.c/z.n,z.d/z.n]:[0,0,0,0];const score=v.reduce((a,x,i)=>a+x*(aw[i]||0),0);return {id:s.id,no:s.no,name:s.name,cat:s.cat,v,score,n:z.n}})}
function avgWeights(){const arr=[];for(const r of (raw&&raw.responses||[])){const a=ahp(r.responses&&r.responses.p2);if(a&&a.cr<=.1)arr.push(a.w)}if(!arr.length)return [0.198,0.388,0.149,0.264];return arr[0].map((_,i)=>arr.reduce((s,w)=>s+w[i],0)/arr.length)}
function submitted(){return (raw&&raw.responses||[]).filter(r=>r.submittedAt).length}
function title(){return hideNames?'응답자':'응답자'}
function layout(body){const t=raw?('<div class="wrap"><div class="top"><div><div class="eyebrow">연구진 전용 · 3차 조사</div><h1>AI 기반 초연결 지능도시 3차 연구진 대시보드</h1><div class="sub">기준 시각: '+esc(raw.generatedAt||'')+' · 3차 관리자 현황판 실시간 조회</div></div><div class="actions"><button class="btn" id="refresh">새로고침</button><button class="btn" id="hide">'+(hideNames?'이름 보이기':'이름 가리기')+'</button></div></div><div class="nav">'+[['overview','종합'],['status','응답 현황'],['ahp','1부 중요도'],['services','2부 서비스'],['logs','접속 로그']].map(x=>'<button class="'+(tab===x[0]?'on':'')+'" data-tab="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>'+body+'</div>'):gate();app.innerHTML=t;bind()}
function gate(){return '<div class="wrap"><div class="card gate"><div class="eyebrow">연구진 전용 · 3차 조사</div><h2>3차 연구진 대시보드</h2><p class="sub">3차 관리자 현황판을 조회하려면 접속코드를 입력하십시오.</p><form id="gate"><input id="code" type="password" placeholder="접속코드" autocomplete="off"><button class="btn primary">불러오기</button></form>'+(err?'<div class="err">'+esc(err)+'</div>':'')+'</div></div>'}
function metrics(){const rr=raw.responses||[],sub=submitted(),prog=rr.length?Math.round(rr.reduce((s,r)=>s+Number(r.progress||0),0)/rr.length*100):0;return '<div class="metrics"><div class="metric"><span>참가자</span><b>'+((raw.tables.roster&&raw.tables.roster.rows)||[]).length+'</b></div><div class="metric"><span>응답 데이터</span><b>'+rr.length+'</b></div><div class="metric"><span>제출 완료</span><b>'+sub+'</b></div><div class="metric"><span>제출률</span><b>'+fmtPct(((raw.tables.roster&&raw.tables.roster.rows)||[]).length?sub/((raw.tables.roster&&raw.tables.roster.rows)||[]).length:0)+'</b></div><div class="metric"><span>평균 진행률</span><b>'+prog+'%</b></div></div>'}
function overview(){const w=avgWeights();return metrics()+'<div class="grid2"><div class="card"><h2>3차 조사 운영 현황</h2><p class="note">현재 3차 전용 관리자 시트와 연결되어 있습니다. 응답이 저장되면 이 화면의 응답 현황, 1부 중요도, 2부 서비스 결과가 함께 갱신됩니다.</p><div class="bar"><i style="width:'+Math.min(100,submitted()/Math.max(1,((raw.tables.roster&&raw.tables.roster.rows)||[]).length)*100)+'%"></i></div><p class="note">제출 완료 '+submitted()+'명</p></div><div class="card"><h2>1부 평균 가중치</h2>'+CRIT.map((c,i)=>'<p><b>'+c[0]+'</b> '+esc(c[1])+' <strong>'+fmtPct(w[i])+'</strong></p>').join('')+'<p class="note">CR ≤ 0.1을 충족한 응답을 우선 집계합니다.</p></div></div>'}
function statusView(){const rows=(raw.tables.r3status&&raw.tables.r3status.rows)||[];return '<div class="card"><h2>응답 현황</h2><p class="note">전체 참가자 명단 기준으로 진행률과 제출 상태를 표시합니다.</p><div class="scroll"><table><thead><tr><th>번호</th><th>성명</th><th>소속</th><th class="num">진행률</th><th>최근 저장</th><th>제출</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+esc(hideNames?'응답자':r[1])+'</td><td>'+esc(r[2])+'</td><td class="num">'+Math.round(Number(r[3]||0)*100)+'%</td><td>'+esc(r[4])+'</td><td class="'+(r[5]?'good':'muted')+'">'+(r[5]?'완료':'미제출')+'</td></tr>').join('')+'</tbody></table></div></div>'}
function ahpView(){const rows=(raw.responses||[]).map(r=>{const a=ahp(r.responses&&r.responses.p2);return {r,a}});const valid=rows.filter(x=>x.a&&x.a.cr<=.1);return '<div class="card"><h2>1부 중요도 재평가</h2><p class="note">응답자별 AHP 가중치와 일관성 비율입니다. 유효 응답 '+valid.length+'명 / 전체 응답 데이터 '+rows.length+'명</p><div class="scroll"><table><thead><tr><th>번호</th><th>성명</th>'+CRIT.map(c=>'<th class="num">'+c[0]+'</th>').join('')+'<th class="num">CR</th><th>판정</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.r.id)+'</td><td>'+esc(hideNames?'응답자':x.r.name)+'</td>'+CRIT.map((c,i)=>'<td class="num">'+(x.a?fmtPct(x.a.w[i]):'-')+'</td>').join('')+'<td class="num">'+(x.a?x.a.cr.toFixed(3):'-')+'</td><td class="'+(x.a&&x.a.cr<=.1?'good':'muted')+'">'+(x.a?(x.a.cr<=.1?'유효':'검토'):'미완료')+'</td></tr>').join('')+'</tbody></table></div></div>'}
function serviceView(){const rows=serviceRows().sort((a,b)=>b.score-a.score);return '<div class="card"><h2>2부 후보서비스 재평가</h2><p class="note">3차 서비스별 평균 점수와 1부 평균 가중치를 적용한 종합점수입니다.</p><div class="scroll"><table><thead><tr><th>순위</th><th>서비스</th><th>분류</th>'+CRIT.map(c=>'<th class="num">'+c[0]+'</th>').join('')+'<th class="num">종합</th><th class="num">응답수</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr><td class="num">'+(i+1)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.cat)+'</td>'+r.v.map(v=>'<td class="num">'+(v?v.toFixed(2):'-')+'</td>').join('')+'<td class="num"><b>'+(r.score?r.score.toFixed(2):'-')+'</b></td><td class="num">'+r.n+'</td></tr>').join('')+'</tbody></table></div></div>'}
function logsView(){const rows=(raw.tables.logs&&raw.tables.logs.rows)||[];return '<div class="card"><h2>접속 로그</h2><div class="scroll"><table><thead><tr><th>시각</th><th>ID</th><th>이름</th><th>동작</th></tr></thead><tbody>'+rows.slice(-300).reverse().map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(hideNames?'응답자':r[2])+'</td><td>'+esc(r[3])+'</td></tr>').join('')+'</tbody></table></div></div>'}
function body(){return tab==='overview'?overview():tab==='status'?statusView():tab==='ahp'?ahpView():tab==='services'?serviceView():logsView()}
function layoutBody(x){return x}
function render(){layout(raw?body():null)}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});const ref=document.getElementById('refresh');if(ref)ref.onclick=()=>load(sessionStorage.getItem('r3boardcode')||'');const hi=document.getElementById('hide');if(hi)hi.onclick=()=>{hideNames=!hideNames;render()};const form=document.getElementById('gate');if(form)form.onsubmit=e=>{e.preventDefault();load(document.getElementById('code').value.trim())}}
async function load(code){if(!code){err='접속코드를 입력하십시오.';render();return}err='';app.innerHTML='<div class="wrap"><div class="card empty">3차 자료를 불러오는 중입니다...</div></div>';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({code})});const j=await r.json();if(!j.ok)throw new Error(j.error==='bad_code'?'접속코드가 맞지 않습니다.':j.error||'자료를 불러오지 못했습니다.');raw=j.data;sessionStorage.setItem('r3boardcode',code);render()}catch(e){err=e.message;raw=null;render()}}
const saved=sessionStorage.getItem('r3boardcode');if(saved)load(saved);else render();
})();
</script></body></html>
